name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Test backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check
      - name: Check formatting and deployment config
        run: pnpm format:check && pnpm validate:compose
      - name: Audit high severity dependencies
        run: pnpm audit --audit-level high
      - name: Build H5
        run: pnpm build:h5
      - name: Build WeChat Mini Program
        run: pnpm build:mp-weixin
      - name: Build admin
        run: pnpm build:admin
