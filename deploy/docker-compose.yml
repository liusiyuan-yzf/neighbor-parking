services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: neighbor_parking
      MYSQL_USER: neighbor_parking
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ../server
    environment:
      SPRING_PROFILES_ACTIVE: mysql,demo
      DB_URL: jdbc:mysql://mysql:3306/neighbor_parking?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: neighbor_parking
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 12

  h5:
    build:
      context: ..
      dockerfile: apps/parking-uniapp/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: apps/parking-admin/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5174:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mysql-data:
