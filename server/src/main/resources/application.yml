server:
  port: 8080

spring:
  application:
    name: neighbor-parking-server
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    dev-enabled: false
  jwt:
    issuer: neighbor-parking
    access-token-minutes: 120
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175
